name: Notify Portfolio

on:
  push:
    branches:
      - main

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger portfolio deployment
        if: env.PORTFOLIO_TOKEN != ''
        env:
          PORTFOLIO_TOKEN: ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $PORTFOLIO_TOKEN" \
            https://api.github.com/repos/o-thiago/portfolio/dispatches \
            -d '{"event_type":"cv-updated"}'
